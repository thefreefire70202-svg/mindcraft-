# Recommended spigot.yml to prevent "TCP connection lost" & "Timed out" disconnects
# Place or edit in your server root directory (e.g. Aternos or dedicated server)
config-version: 12
settings:
  debug: false
  bungeecord: false
  sample-count: 12
  player-shuffle: 0
  user-cache-size: 1000
  save-user-cache-on-stop-only: false
  moved-wrongly-threshold: 0.0625
  moved-too-quickly-multiplier: 10.0
  # CRITICAL: Increase timeout-time from 60 to 120 or 180 seconds.
  # This prevents Spigot/Paper from terminating slow or high-ping bot TCP connections.
  timeout-time: 120
  restart-on-crash: false
  restart-script: ./start.sh
  netty-threads: 4
  attribute:
    maxHealth:
      max: 2048.0
    movementSpeed:
      max: 2048.0
    attackDamage:
      max: 2048.0
  log-villager-deaths: true
  log-named-deaths: true
messages:
  whitelist: You are not whitelisted on this server!
  unknown-command: Unknown command. Type "/help" for help.
  server-full: The server is full!
  outdated-client: Outdated client! Please use {0}
  outdated-server: Outdated server! I'm still on {0}
  restart: Server is restarting
advancements:
  disable-saving: false
  disabled:
  - minecraft:story/disabled
players:
  disable-saving: false
commands:
  tab-complete: 0
  send-namespaced: true
  log: true
  spam-exclusions:
  - /skill
  silent-evaluations: false
  replace-commands:
  - setblock
  - summon
  - testforblock
  - tellraw
