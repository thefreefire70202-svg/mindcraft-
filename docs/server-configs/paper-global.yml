# Recommended paper-global.yml (for Paper and Purpur servers)
# Configures packet limiter thresholds and network settings
_version: 29
packet-limiter:
  all-packets:
    action: DROP
    interval: 7.0
    max-packet-rate: 1000.0
  kick-message: "<red><lang:disconnect.exceeded_packet_rate>"
  overrides:
    ServerboundChatPacket:
      action: DROP
      interval: 1.0
      max-packet-rate: 20.0
proxies:
  bungee-cord:
    online-mode: false
  velocity:
    enabled: false
    online-mode: false
    secret: ''
network:
  # 256 bytes standard compression threshold
  compression-threshold: 256
  max-full-load-nanoseconds: 20000000
